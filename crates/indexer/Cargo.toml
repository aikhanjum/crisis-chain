[package]
name = "indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy = { version = "0.13", features = ["full", "node-bindings"] }
anyhow = "1.0"
axum = "0.8"
dotenvy = "0.15"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
