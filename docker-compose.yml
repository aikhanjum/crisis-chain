services:

  # ── Database ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crisis_pool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d   # auto-runs all .sql files on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Rust indexer ────────────────────────────────────────────────────
  # Polls Arbitrum Sepolia for Donation/Payout events and exposes REST API
  indexer:
    build:
      context: .
      dockerfile: crates/indexer/Dockerfile   # TODO: create this Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crisis_pool
      HTTP_BIND_ADDR: 0.0.0.0:3001
      RPC_URL: ${RPC_URL}
      CHAIN_ID: ${CHAIN_ID:-7080969}
      VAULT_ADDRESS: ${VAULT_ADDRESS}
      USDC_ADDRESS: ${USDC_ADDRESS}
      START_BLOCK: ${START_BLOCK:-0}
      CONFIRMATIONS: ${CONFIRMATIONS:-0}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["indexer"]   # opt-in: docker compose --profile indexer up

  # ── Python: Crisis Intelligence ─────────────────────────────────────
  crisis-intelligence:
    build: ./services/crisis-intelligence
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/crisis_pool
      ACLED_EMAIL: ${ACLED_EMAIL}
      ACLED_PASSWORD: ${ACLED_PASSWORD}
      ACLED_ACCESS_TOKEN: ${ACLED_ACCESS_TOKEN:-}
      ACLED_DATA_CAP_YEAR: ${ACLED_DATA_CAP_YEAR:-2026}
      ACLED_QUERY_END_DATE: ${ACLED_QUERY_END_DATE:-}
      AI_SUMMARY_URL: http://ai-summary:8002
      BLOCKCHAIN_BRIDGE_URL: http://blockchain-bridge:4001
      SEVERITY_DEPLOY_THRESHOLD: ${SEVERITY_DEPLOY_THRESHOLD:-60}
      NGO_DISCOVERY_PER_REGION_LIMIT: ${NGO_DISCOVERY_PER_REGION_LIMIT:-50}
      HDX_HAPI_BASE: ${HDX_HAPI_BASE:-https://hapi.humdata.org}
      HDX_HAPI_APPLICATION_NAME: ${HDX_HAPI_APPLICATION_NAME:-CrisisChain}
      # Falls back to ACLED_EMAIL so one address can satisfy both APIs
      HDX_HAPI_CONTACT_EMAIL: ${HDX_HAPI_CONTACT_EMAIL:-${ACLED_EMAIL}}
      HDX_HAPI_APP_IDENTIFIER: ${HDX_HAPI_APP_IDENTIFIER:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # slim image has no curl — use stdlib
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)",
        ]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 45s

  # ── Python: AI Summary ──────────────────────────────────────────────
  ai-summary:
    build: ./services/ai-summary
    ports:
      - "8002:8002"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)",
        ]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 30s

  # ── Python: OCR Receipt ─────────────────────────────────────────────
  ocr-receipt:
    build: ./services/ocr-receipt
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/crisis_pool
      BLOCKCHAIN_BRIDGE_URL: http://blockchain-bridge:4001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5)",
        ]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 30s

  # ── Node.js: API Gateway ────────────────────────────────────────────
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crisis_pool
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      INDEXER_URL: http://indexer:3001
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      PORT: 4000
      # Vault payouts: gateway calls bridge → reimbursement/submit (use service name in Compose).
      BLOCKCHAIN_BRIDGE_URL: ${BLOCKCHAIN_BRIDGE_URL:-http://blockchain-bridge:4001}
      # Always use Compose DNS — never http://localhost from .env here (localhost is THIS container).
      CRISIS_INTELLIGENCE_URL: http://crisis-intelligence:8001
    depends_on:
      postgres:
        condition: service_healthy
      crisis-intelligence:
        condition: service_healthy
    healthcheck:
      # node:slim has no curl
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 30s

  # ── Node.js: Blockchain Bridge ──────────────────────────────────────
  blockchain-bridge:
    build: ./services/blockchain-bridge
    ports:
      - "4001:4001"
    volumes:
      - ./contracts/out:/contracts/out:ro   # compiled Foundry artifacts for ABI loading
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crisis_pool
      RPC_URL: ${RPC_URL}
      PRIVATE_KEY: ${PRIVATE_KEY}
      VAULT_ADDRESS: ${VAULT_ADDRESS}
      USDC_ADDRESS: ${USDC_ADDRESS}
      PINATA_API_KEY: ${PINATA_API_KEY}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY}
      CONTRACTS_OUT_DIR: /contracts/out
      PORT: 4001
    depends_on:
      postgres:
        condition: service_healthy

  # ── Next.js Frontend ────────────────────────────────────────────────
  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:4000
      NEXT_PUBLIC_INDEXER_URL: http://localhost:3001
      NEXT_PUBLIC_CHAIN_ID: ${CHAIN_ID:-7080969}
      NEXT_PUBLIC_VAULT_ADDRESS: ${VAULT_ADDRESS}
      NEXT_PUBLIC_USDC_ADDRESS: ${USDC_ADDRESS}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${WALLETCONNECT_PROJECT_ID}
    depends_on:
      - api-gateway
    profiles: ["frontend"]  # opt-in: docker compose --profile frontend up

volumes:
  postgres_data:
