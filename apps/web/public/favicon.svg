<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <filter id="gc" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="ga" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="gw" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <radialGradient id="globe-grad" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#0D2B4E"/>
      <stop offset="100%" stop-color="#050D1A"/>
    </radialGradient>
    <!-- Motion path: hexagon of 6 nodes -->
    <path id="ring" d="M50,17 L78.58,33.5 L78.58,66.5 L50,83 L21.42,66.5 L21.42,33.5 Z" fill="none"/>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="#040C17"/>

  <!-- Spokes: center to each node -->
  <line x1="50" y1="50" x2="50"    y2="17"   stroke="#0D2438" stroke-width="0.8"/>
  <line x1="50" y1="50" x2="78.58" y2="33.5" stroke="#0D2438" stroke-width="0.8"/>
  <line x1="50" y1="50" x2="78.58" y2="66.5" stroke="#0D2438" stroke-width="0.8"/>
  <line x1="50" y1="50" x2="50"    y2="83"   stroke="#0D2438" stroke-width="0.8"/>
  <line x1="50" y1="50" x2="21.42" y2="66.5" stroke="#0D2438" stroke-width="0.8"/>
  <line x1="50" y1="50" x2="21.42" y2="33.5" stroke="#0D2438" stroke-width="0.8"/>

  <!-- Hexagonal ring -->
  <path d="M50,17 L78.58,33.5 L78.58,66.5 L50,83 L21.42,66.5 L21.42,33.5 Z"
        stroke="#0E2D4A" stroke-width="1.2" fill="none" stroke-linejoin="round"/>

  <!-- Central globe -->
  <circle cx="50" cy="50" r="14" fill="url(#globe-grad)" stroke="#163657" stroke-width="0.8"/>
  <ellipse cx="50" cy="50" rx="14" ry="4.5" stroke="#1C4470" stroke-width="0.55" fill="none"/>
  <ellipse cx="50" cy="50" rx="14" ry="9"   stroke="#163657" stroke-width="0.45" fill="none"/>
  <path d="M50,36 Q57,50 50,64" stroke="#163657" stroke-width="0.5" fill="none"/>
  <path d="M50,36 Q43,50 50,64" stroke="#163657" stroke-width="0.5" fill="none"/>
  <line x1="50" y1="36" x2="50" y2="64" stroke="#1C4470" stroke-width="0.45"/>

  <!-- Node dots (amber at 0,2,4 — cyan at 1,3,5) -->
  <!-- Node 0: top (50,17) amber -->
  <circle cx="50"    cy="17"   r="5.5" fill="none" stroke="#F5A623" stroke-width="0.6" opacity="0.25"/>
  <circle cx="50"    cy="17"   r="3.2" fill="#040C17" stroke="#F5A623" stroke-width="1.4" filter="url(#ga)"/>
  <circle cx="50"    cy="17"   r="3.2" fill="none" stroke="#F5A623" stroke-width="0.8" opacity="0">
    <animate attributeName="r" values="3.2;7;3.2" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 1: top-right (78.58,33.5) cyan -->
  <circle cx="78.58" cy="33.5" r="5.5" fill="none" stroke="#00C6FF" stroke-width="0.6" opacity="0.25"/>
  <circle cx="78.58" cy="33.5" r="3.2" fill="#040C17" stroke="#00C6FF" stroke-width="1.4" filter="url(#gc)"/>
  <circle cx="78.58" cy="33.5" r="3.2" fill="none" stroke="#00C6FF" stroke-width="0.8" opacity="0">
    <animate attributeName="r" values="3.2;7;3.2" dur="2.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.9s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 2: bottom-right (78.58,66.5) amber -->
  <circle cx="78.58" cy="66.5" r="5.5" fill="none" stroke="#F5A623" stroke-width="0.6" opacity="0.25"/>
  <circle cx="78.58" cy="66.5" r="3.2" fill="#040C17" stroke="#F5A623" stroke-width="1.4" filter="url(#ga)"/>
  <circle cx="78.58" cy="66.5" r="3.2" fill="none" stroke="#F5A623" stroke-width="0.8" opacity="0">
    <animate attributeName="r" values="3.2;7;3.2" dur="3.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3.3s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 3: bottom (50,83) cyan -->
  <circle cx="50"    cy="83"   r="5.5" fill="none" stroke="#00C6FF" stroke-width="0.6" opacity="0.25"/>
  <circle cx="50"    cy="83"   r="3.2" fill="#040C17" stroke="#00C6FF" stroke-width="1.4" filter="url(#gc)"/>
  <circle cx="50"    cy="83"   r="3.2" fill="none" stroke="#00C6FF" stroke-width="0.8" opacity="0">
    <animate attributeName="r" values="3.2;7;3.2" dur="3.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3.7s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 4: bottom-left (21.42,66.5) amber -->
  <circle cx="21.42" cy="66.5" r="5.5" fill="none" stroke="#F5A623" stroke-width="0.6" opacity="0.25"/>
  <circle cx="21.42" cy="66.5" r="3.2" fill="#040C17" stroke="#F5A623" stroke-width="1.4" filter="url(#ga)"/>
  <circle cx="21.42" cy="66.5" r="3.2" fill="none" stroke="#F5A623" stroke-width="0.8" opacity="0">
    <animate attributeName="r" values="3.2;7;3.2" dur="4.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="4.1s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 5: top-left (21.42,33.5) cyan -->
  <circle cx="21.42" cy="33.5" r="5.5" fill="none" stroke="#00C6FF" stroke-width="0.6" opacity="0.25"/>
  <circle cx="21.42" cy="33.5" r="3.2" fill="#040C17" stroke="#00C6FF" stroke-width="1.4" filter="url(#gc)"/>
  <circle cx="21.42" cy="33.5" r="3.2" fill="none" stroke="#00C6FF" stroke-width="0.8" opacity="0">
    <animate attributeName="r" values="3.2;7;3.2" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Traveling signal -->
  <circle r="5" fill="white" opacity="0.12">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#ring"/>
    </animateMotion>
  </circle>
  <circle r="2.8" fill="white" filter="url(#gw)">
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#ring"/>
    </animateMotion>
  </circle>

  <!-- Center core pulse -->
  <circle cx="50" cy="50" r="2.5" fill="#AACDE8" opacity="0.9">
    <animate attributeName="r" values="2;3.2;2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
